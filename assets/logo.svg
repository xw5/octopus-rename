<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 256 256">
  <!-- 章鱼重命名 Octopus Rename logo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D77FF"/>
      <stop offset="1" stop-color="#6236D9"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256" rx="58"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>

    <!-- 两侧卷足：从文件身后探出，向外下卷（dark 描边在下、白色主体在上） -->
    <g fill="none" stroke-linecap="round">
      <path d="M 96 150 C 58 152, 42 176, 52 200 C 58 214, 74 216, 80 206 C 84 199, 78 193, 72 197" stroke="#3F2494" stroke-width="23"/>
      <path d="M 96 150 C 58 152, 42 176, 52 200 C 58 214, 74 216, 80 206 C 84 199, 78 193, 72 197" stroke="#FFFFFF" stroke-width="15"/>

      <path d="M 160 150 C 198 152, 214 176, 204 200 C 198 214, 182 216, 176 206 C 172 199, 178 193, 184 197" stroke="#3F2494" stroke-width="23"/>
      <path d="M 160 150 C 198 152, 214 176, 204 200 C 198 214, 182 216, 176 206 C 172 199, 178 193, 184 197" stroke="#FFFFFF" stroke-width="15"/>
    </g>

    <!-- 头部（从文件后探出） -->
    <ellipse cx="128" cy="94" rx="64" ry="56" fill="#FFFFFF" stroke="#3F2494" stroke-width="6"/>

    <!-- 表情 -->
    <circle cx="106" cy="90" r="9.5" fill="#3F2494"/>
    <circle cx="150" cy="90" r="9.5" fill="#3F2494"/>
    <circle cx="103" cy="87" r="3.2" fill="#FFFFFF"/>
    <circle cx="147" cy="87" r="3.2" fill="#FFFFFF"/>
    <path d="M 116 112 Q 128 122 139 112" fill="none" stroke="#3F2494" stroke-width="5" stroke-linecap="round"/>

    <!-- 文件（前景，被章鱼环抱） -->
    <path d="M 84 142 Q 84 132 94 132 L 128 132 L 172 176 L 172 226 Q 172 236 162 236 L 94 236 Q 84 236 84 226 Z"
          fill="#F1EBFF" stroke="#3F2494" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M 128 132 L 172 176 L 138 176 Q 128 176 128 167 Z"
          fill="#D9CCFF" stroke="#3F2494" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="#7A4FE0" stroke-width="7" stroke-linecap="round">
      <path d="M 98 196 H 158"/>
      <path d="M 98 212 H 142"/>
    </g>
  </g>
</svg>
